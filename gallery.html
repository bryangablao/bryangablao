<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/Gallery/MainLogo.png">
  <title>Gallery | Bryan G. Ablao</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ---------- Theme & CSS Variables ---------- */
    :root {
      --bg-dark: #090a0f;
      --accent-purple: #6d28d9;
      --accent-purple-glow: rgba(109, 40, 217, 0.4);
      --accent-blue: #3b82f6;
      --glass-bg: rgba(18, 20, 29, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --radius-lg: 16px;
      --radius-md: 10px;
      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ---------- Global Reset & Typography ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: var(--transition-smooth);
    }

    /* Background Canvases */
    #starsCanvas, #rippleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    #starsCanvas { z-index: 0; }
    #rippleCanvas { z-index: 1; }

    /* Ambient Glow Effects */
    .ambient-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-purple-glow) 0%, rgba(0,0,0,0) 70%);
      top: -150px;
      left: -150px;
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
    }

    /* ---------- Navigation Bar ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 5%;
      background: rgba(9, 10, 15, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
    }

    .nav-brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .desktop-nav {
      display: flex;
      gap: 1.5rem;
    }

    .desktop-nav a {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .desktop-nav a:hover, .desktop-nav a.active {
      color: var(--text-main);
    }

    .hamburger {
      display: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-main);
    }

    /* Mobile Sidebar Drawer */
    #sidebarOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      z-index: 1000;
    }

    #sidebar {
      position: fixed;
      top: 0;
      right: -280px;
      width: 280px;
      height: 100%;
      background: var(--bg-dark);
      border-left: 1px solid var(--glass-border);
      padding: 5rem 1.5rem 2rem;
      transition: right 0.3s ease;
      z-index: 1001;
    }

    #sidebar.open { right: 0; }

    #sidebar ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #sidebar ul li a {
      font-size: 1.05rem;
      color: var(--text-muted);
      display: block;
      padding: 0.5rem 0;
    }

    #sidebar ul li a:hover { color: var(--text-main); }

    /* ---------- Main Layout ---------- */
    #blur-container {
      position: relative;
      z-index: 2;
      transition: filter 0.3s ease;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    /* Glass Card Standard */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.25rem;
    }

    .gallery-grid img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .gallery-grid img:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(167, 139, 250, 0.4);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    /* ---------- Modals ---------- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 2000;
      padding: 1.5rem;
    }

    .modal-content {
      max-width: 90%;
      max-height: 80vh;
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      object-fit: contain;
      margin-bottom: 1.5rem;
      animation: modalFade 0.25s ease-out;
    }

    @keyframes modalFade {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .close {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      font-size: 2rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
      transition: var(--transition-smooth);
    }

    .close:hover { color: var(--text-main); }

    .download-btn {
      padding: 0.75rem 1.75rem;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      color: white;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(109, 40, 217, 0.4);
      transition: var(--transition-smooth);
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(109, 40, 217, 0.6);
    }

    /* Body State When Modal Active */
    body.modal-open #blur-container { filter: blur(6px); }
    body.modal-open { overflow: hidden; }

    /* ---------- Footer ---------- */
    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 3rem 1.5rem;
      border-top: 1px solid var(--glass-border);
      margin-top: 4rem;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .footer-link {
      color: var(--text-muted);
    }

    .footer-link:hover {
      color: var(--text-main);
    }

    /* ---------- Responsive Breakpoints ---------- */
    @media (max-width: 850px) {
      .desktop-nav { display: none; }
      .hamburger { display: block; }
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }
    }
  </style>
</head>
<body>

  <!-- Animated Background Elements -->
  <div class="ambient-glow"></div>
  <canvas id="starsCanvas"></canvas>
  <canvas id="rippleCanvas"></canvas>

  <!-- Sticky Header -->
  <header>
    <div class="nav-brand">Bryan G. Ablao</div>
    <nav class="desktop-nav">
      <a href="index.html">About</a>
      <a href="work.html">Experience</a>
      <a href="projects.html">Projects</a>
      <a href="achievement.html">Achievements</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="social.html">Socials</a>
    </nav>
    <div class="hamburger" onclick="toggleMenu()" aria-label="Toggle Navigation">☰</div>
  </header>

  <!-- Mobile Drawer Overlay -->
  <div id="sidebarOverlay" onclick="closeMenu()"></div>

  <!-- Mobile Navigation Drawer -->
  <nav id="sidebar">
    <ul>
      <li><a href="index.html">About Me</a></li>
      <li><a href="work.html">Work Experience</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="achievement.html">Achievements</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="social.html">Social Medias</a></li>
    </ul>
  </nav>

  <!-- Main Content Area -->
  <div id="blur-container">
    <main>
      <section class="glass-card">
        <h3 class="section-title">Photo Gallery</h3>
        <div class="gallery-grid">
          <img src="images/wpm.PNG" alt="Gallery Image" onclick="openModal(this)">
          <img src="images/Gallery/Family/528945808_595295430326990_2495007725531082246_n.jpg" alt="Gallery Image" onclick="openModal(this)">
          <img src="images/Gallery/Me/527920139_3290240134465747_6607549781087499359_n.jpg" alt="Gallery Image" onclick="openModal(this)">
          <img src="images/Gallery/Me/530849010_637411352735664_9029550789082022234_n.jpg" alt="Gallery Image" onclick="openModal(this)">
          <img src="images/Gallery/Me/Me.jpg" alt="Gallery Image" onclick="openModal(this)">
          <img src="images/Gallery/Family/family.png" alt="Gallery Image" onclick="openModal(this)">
          <img src="images/Gallery/Family/family1.jpg" alt="Gallery Image" onclick="openModal(this)">
          <img src="images/ME1.jpg" alt="Gallery Image" onclick="openModal(this)">
          <img src="images/sbi1.jfif" alt="Gallery Image" onclick="openModal(this)">
          <img src="images/sbi2026.jpg" alt="Gallery Image" onclick="openModal(this)">
          <img src="images/sbimen.jfif" alt="Gallery Image" onclick="openModal(this)">
          <img src="images/Gallery/Friends/sbiall.jfif" alt="Gallery Image" onclick="openModal(this)">
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <div>© 2025–2026 <strong>Accxs Creations</strong>. All rights reserved.</div>
      <div class="footer-links">
        <a href="version.html" class="footer-link">v0.0.8</a>
        <span>·</span>
        <a href="terms.html" class="footer-link">Terms &amp; Privacy</a>
      </div>
    </footer>
  </div>

  <!-- Image Viewer Modal -->
  <div id="imageModal" class="modal-overlay">
    <span class="close" onclick="closeModal()">&times;</span>
    <img id="modalImg" class="modal-content" alt="Enlarged gallery view">
    <a id="downloadBtn" class="download-btn" download="">Download</a>
  </div>

  <!-- Scripts -->
  <script>
    // Navigation Control
    function toggleMenu() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");
      const isOpen = sidebar.classList.toggle("open");
      overlay.style.display = isOpen ? "block" : "none";
    }

    function closeMenu() {
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebarOverlay").style.display = "none";
    }

    // Modal Control
    function openModal(img) {
      const modal = document.getElementById("imageModal");
      const modalImg = document.getElementById("modalImg");
      const downloadBtn = document.getElementById("downloadBtn");
      modal.style.display = "flex";
      modalImg.src = img.src;
      downloadBtn.href = img.src;
      document.body.classList.add("modal-open");
    }

    function closeModal() {
      document.getElementById("imageModal").style.display = "none";
      document.body.classList.remove("modal-open");
    }

    document.getElementById("imageModal").addEventListener("click", function(e) {
      if (e.target.id === "imageModal") closeModal();
    });

    // Starfield Animation
    const starsCanvas = document.getElementById('starsCanvas');
    const starsCtx = starsCanvas.getContext('2d');
    let stars = [], meteor = null;

    function resizeStarsCanvas() {
      starsCanvas.width = window.innerWidth;
      starsCanvas.height = window.innerHeight;
      generateStars();
    }

    function generateStars() {
      stars = [];
      const density = Math.floor((starsCanvas.width * starsCanvas.height) / 6000);
      for (let i = 0; i < density; i++) {
        stars.push({
          x: Math.random() * starsCanvas.width,
          y: Math.random() * starsCanvas.height,
          alpha: Math.random() * 0.7 + 0.3,
          radius: Math.random() * 1.2 + 0.4,
          flickerSpeed: Math.random() * 0.02 + 0.005
        });
      }
    }

    function drawMeteor() {
      if (!meteor) return;
      starsCtx.save();
      const grad = starsCtx.createLinearGradient(meteor.x, meteor.y, meteor.x - meteor.vx * 10, meteor.y - meteor.vy * 10);
      grad.addColorStop(0, `rgba(255,255,255,${meteor.alpha})`);
      grad.addColorStop(1, `rgba(255,255,255,0)`);
      starsCtx.strokeStyle = grad;
      starsCtx.lineWidth = 1.5;
      starsCtx.beginPath();
      starsCtx.moveTo(meteor.x, meteor.y);
      starsCtx.lineTo(meteor.x - meteor.vx * 15, meteor.y - meteor.vy * 15);
      starsCtx.stroke();
      starsCtx.restore();
    }

    function animateStars() {
      starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
      stars.forEach(star => {
        star.alpha += star.flickerSpeed * (Math.random() < 0.5 ? -1 : 1);
        star.alpha = Math.min(0.9, Math.max(0.2, star.alpha));
        starsCtx.beginPath();
        starsCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        starsCtx.fillStyle = `rgba(255,255,255,${star.alpha})`;
        starsCtx.fill();
      });

      if (meteor) {
        meteor.x += meteor.vx;
        meteor.y += meteor.vy;
        meteor.alpha -= 0.012;
        drawMeteor();
        if (meteor.alpha <= 0 || meteor.x < -50 || meteor.y > starsCanvas.height + 50) {
          meteor = null;
          setTimeout(spawnMeteor, Math.random() * 4000 + 3000);
        }
      }
      requestAnimationFrame(animateStars);
    }

    function spawnMeteor() {
      meteor = {
        x: Math.random() * starsCanvas.width,
        y: -20,
        vx: -(Math.random() * 3 + 2),
        vy: Math.random() * 2 + 2,
        alpha: 1
      };
    }

    window.addEventListener('resize', resizeStarsCanvas);
    resizeStarsCanvas();
    animateStars();
    setTimeout(spawnMeteor, 2000);

    // Mouse Ripple Effect
    const rippleCanvas = document.getElementById('rippleCanvas');
    const rippleCtx = rippleCanvas.getContext('2d');
    let ripples = [];

    function resizeRippleCanvas() {
      rippleCanvas.width = window.innerWidth;
      rippleCanvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeRippleCanvas);
    resizeRippleCanvas();

    window.addEventListener('mousemove', (e) => {
      if (Math.random() > 0.3) return; // Throttle ripple creation for smoother performance
      ripples.push({ x: e.clientX, y: e.clientY, radius: 0, alpha: 0.25 });
      if (ripples.length > 15) ripples.shift();
    });

    function animateRipples() {
      rippleCtx.clearRect(0, 0, rippleCanvas.width, rippleCanvas.height);
      ripples.forEach((r, i) => {
        r.radius += 1.2;
        r.alpha -= 0.008;
        if (r.alpha <= 0) {
          ripples.splice(i, 1);
          return;
        }
        rippleCtx.beginPath();
        rippleCtx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        rippleCtx.strokeStyle = `rgba(167, 139, 250, ${r.alpha})`;
        rippleCtx.lineWidth = 1;
        rippleCtx.stroke();
      });
      requestAnimationFrame(animateRipples);
    }
    animateRipples();
  </script>
</body>
</html>
